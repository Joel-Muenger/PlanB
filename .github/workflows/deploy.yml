name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Die App liegt unter https://<name>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # URL des Preisproxys (Repo-Variable FARE_API_URL); leer ⇒ keine Preisanzeige
          VITE_FARE_API_URL: ${{ vars.FARE_API_URL }}
      # GitHub Pages kennt keine SPA-Routen: unbekannte Pfade (z. B. /alternativen) liefern 404.html.
      - run: cp client/dist/index.html client/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
